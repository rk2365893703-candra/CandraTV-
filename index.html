<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CandraTV</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #161b22;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #f39c12;
        }
        .hero {
            padding: 40px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba') no-repeat center center/cover;
        }
        .hero h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .btn {
            background-color: #f39c12;
            color: #000;
            padding: 10px 20px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
        }
        .categories {
            padding: 20px;
        }
        .categories h2 {
            margin-bottom: 5px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .card {
            background-color: #21262d;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 15px;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            color: #ffffff;
            display: block;
        }
        .card:hover {
            transform: scale(1.03);
        }
        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .card h3 {
            font-size: 16px;
            margin: 10px 0 5px 0;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">▶ CandraTV</div>
    </header>

    <div class="hero">
        <h1>Welcome to CandraTV</h1>
        <p>Your entertainment world. Discover stories for every mood.</p>
        <a href="#categories" class="btn">Explore Now</a>
    </div>

    <div class="categories" id="categories">
        <h2>Movie Categories</h2>
        <p style="color: #8b949e; font-size: 14px;">Choose your mood, find your movie.</p>
        
        <div class="grid">
            <!-- Love Story Category -->
            <a href="https://t.me/CandraTV" target="_blank" class="card">
                <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7" alt="Love Story">
                <h3>Love Story</h3>
            </a>
            
            <!-- Emotional Category -->
            <a href="https://t.me/CandraTV" target="_blank" class="card">
                <img src="https://images.unsplash.com/photo-1509198397868-475647b2a1e5" alt="Emotional">
                <h3>Emotional</h3>
            </a>
            
            <!-- Action Category -->
            <a href="https://t.me/CandraTV" target="_blank" class="card">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1" alt="Action">
                <h3>Action</h3>
            </a>
            
            <!-- Comedy Category -->
            <a href="https://t.me/CandraTV" target="_blank" class="card">
                <img src="https://images.unsplash.com/photo-1514306191614-3a3896c8d1bd" alt="Comedy">
                <h3>Comedy</h3>
            </a>
        </div>
    </div>

</body>
          </html>
